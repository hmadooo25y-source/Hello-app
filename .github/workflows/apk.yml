name: Build CardLab APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip and prepare web files
        run: |
          set -euo pipefail
          rm -rf _extract www && mkdir _extract www
          ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n1 || true)
          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d _extract
            SRC=$(dirname "$(find _extract -name index.html -not -path '*/__MACOSX/*' | head -n1)")
          else
            SRC=.
          fi
          [ -f "$SRC/index.html" ] || { echo "index.html not found"; exit 1; }
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do
            cp "$SRC/$f" www/
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          set -euo pipefail
          mkdir app && cd app
          mv ../www ./www
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init CardLab com.cardlab.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Use app icon
        run: |
          set -euo pipefail
          ICON="$GITHUB_WORKSPACE/app/www/icon-192.png"
          cd app/android/app/src/main/res
          for d in mipmap-*dpi; do
            cp "$ICON" "$d/ic_launcher.png"
            cp "$ICON" "$d/ic_launcher_round.png"
            cp "$ICON" "$d/ic_launcher_foreground.png"
          done
          rm -rf mipmap-anydpi-v26

      - name: Build debug APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CardLab-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
